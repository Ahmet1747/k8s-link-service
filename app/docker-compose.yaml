services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: changeme   # dummy — prod'da Secret kullanılır
      POSTGRES_DB: urls
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d urls"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://appuser:changeme@db:5432/urls
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data: